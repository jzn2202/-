<div id="reminder-light-preview" class="rm-preview">
  <style>
    #reminder-light-preview {
      --rm-ink: #1a2b35;
      --rm-muted: #687b85;
      --rm-line: #dce7e9;
      --rm-surface: #ffffff;
      --rm-soft: #f3f8f8;
      --rm-teal: #167c7d;
      --rm-teal-dark: #116768;
      --rm-teal-soft: #e1f3f1;
      --rm-orange: #f4a25e;
      color: var(--rm-ink);
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      width: 100%;
    }
    #reminder-light-preview * { box-sizing: border-box; }
    #reminder-light-preview .preview-switch {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
      margin: 0 0 15px;
    }
    #reminder-light-preview .preview-switch button {
      font: inherit; font-size: 13px; font-weight: 600;
      color: #526770; background: #edf3f3; border: 1px solid #d9e5e6;
      border-radius: 999px; padding: 8px 16px; min-height: 36px;
    }
    #reminder-light-preview .preview-switch button[aria-pressed="true"] {
      color: #fff; background: var(--rm-teal); border-color: var(--rm-teal);
    }
    #reminder-light-preview .preview-stage {
      padding: 20px 12px; display: flex; justify-content: center; align-items: flex-start;
      border-radius: 20px;
    }
    #reminder-light-preview .window {
      width: min(600px, 100%); background: var(--rm-surface);
      border: 1px solid #d9e3e4; border-radius: 16px; overflow: hidden;
      box-shadow: 0 22px 60px rgba(34, 67, 73, .15), 0 4px 14px rgba(34, 67, 73, .08);
      position: relative;
    }
    #reminder-light-preview .window-bar {
      min-height: 52px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid #ebf0f1; padding: 0 18px;
      background: #fff;
    }
    #reminder-light-preview .brand-mark {
      width: 27px; height: 27px; border-radius: 8px; display: grid; place-items: center;
      color: #fff; background: var(--rm-teal);
    }
    #reminder-light-preview .brand-mark svg { width: 16px; height: 16px; }
    #reminder-light-preview .brand-title { font-size: 13px; font-weight: 700; letter-spacing: .01em; }
    #reminder-light-preview .window-actions {
      margin-left: auto; display: flex; align-items: center; gap: 16px; color: #92a1a8;
      font-size: 18px; line-height: 1; user-select: none;
    }
    #reminder-light-preview .window-body { padding: 30px 36px 26px; }
    #reminder-light-preview h2 {
      margin: 0; font-size: 24px; line-height: 1.35; letter-spacing: -.025em;
      font-weight: 700; color: var(--rm-ink);
    }
    #reminder-light-preview .intro {
      margin: 8px 0 25px; color: var(--rm-muted); font-size: 13px; line-height: 1.55;
    }
    #reminder-light-preview .field-label {
      display: block; color: #435b65; font-size: 13px; font-weight: 650;
      margin-bottom: 10px;
    }
    #reminder-light-preview .time-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    #reminder-light-preview .time-part { flex: 1; min-width: 0; }
    #reminder-light-preview .time-part span {
      display: block; font-size: 11px; color: var(--rm-muted); margin: 0 0 6px;
    }
    #reminder-light-preview .time-part input {
      width: 100%; height: 55px; border: 1px solid var(--rm-line); border-radius: 11px;
      background: #fbfdfd; color: var(--rm-ink); text-align: center;
      font: 600 26px "Segoe UI", "Microsoft YaHei UI", sans-serif; font-variant-numeric: tabular-nums;
    }
    #reminder-light-preview .time-separator {
      align-self: flex-end; padding-bottom: 11px; color: #91a6ac; font-size: 23px; font-weight: 700;
    }
    #reminder-light-preview textarea {
      width: 100%; height: 112px; resize: vertical; min-height: 82px;
      border: 1px solid var(--rm-line); border-radius: 11px; background: #fbfdfd;
      padding: 13px 15px; color: var(--rm-ink); font: 14px/1.5 "Microsoft YaHei UI", sans-serif;
    }
    #reminder-light-preview textarea::placeholder { color: #a0afb5; }
    #reminder-light-preview .sound-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin: 19px 0 23px; color: #435b65; font-size: 13px;
    }
    #reminder-light-preview .sound-row label { display: flex; align-items: center; gap: 8px; }
    #reminder-light-preview .sound-row svg { width: 16px; height: 16px; color: var(--rm-teal); }
    #reminder-light-preview .sound-row input { accent-color: var(--rm-teal); width: 18px; height: 18px; }
    #reminder-light-preview .primary-action,
    #reminder-light-preview .secondary-action,
    #reminder-light-preview .text-action {
      font: 600 14px "Microsoft YaHei UI", sans-serif;
      min-height: 44px; border-radius: 10px; display: inline-flex; justify-content: center;
      align-items: center; gap: 8px; padding: 10px 18px;
    }
    #reminder-light-preview .primary-action {
      color: #fff; background: var(--rm-teal); border: 1px solid var(--rm-teal);
    }
    #reminder-light-preview .primary-action:hover { background: var(--rm-teal-dark); }
    #reminder-light-preview .secondary-action {
      color: #2f5961; background: #eff6f5; border: 1px solid #dceae8;
    }
    #reminder-light-preview .text-action {
      color: #647b84; background: transparent; border: 1px solid transparent;
    }
    #reminder-light-preview .full { width: 100%; }
    #reminder-light-preview .button-icon svg { width: 16px; height: 16px; }
    #reminder-light-preview .footnote {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      color: #8a9da5; font-size: 11px; margin-top: 15px;
    }
    #reminder-light-preview .footnote svg { width: 13px; height: 13px; }
    #reminder-light-preview .validation { color: #b34242; font-size: 12px; margin: -13px 0 10px; }
    #reminder-light-preview .status-pill {
      display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px;
      border-radius: 999px; background: var(--rm-teal-soft); color: #126b6c;
      font-size: 12px; font-weight: 700; margin-bottom: 18px;
    }
    #reminder-light-preview .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #1d9a8c; }
    #reminder-light-preview .running-heading { font-size: 22px; }
    #reminder-light-preview .timer-area { text-align: center; padding: 20px 0 24px; }
    #reminder-light-preview .timer-caption { color: var(--rm-muted); font-size: 13px; margin-bottom: 7px; }
    #reminder-light-preview .timer-digits {
      font: 650 clamp(44px, 8vw, 70px)/1.1 "Segoe UI", sans-serif;
      letter-spacing: .015em; font-variant-numeric: tabular-nums; color: var(--rm-ink);
    }
    #reminder-light-preview .progress-track { height: 7px; border-radius: 999px; background: #e6eeee; overflow: hidden; }
    #reminder-light-preview .progress-fill { width: 26%; height: 100%; border-radius: inherit; background: var(--rm-teal); }
    #reminder-light-preview .progress-detail {
      display: flex; justify-content: space-between; color: #91a2a8; font-size: 11px; margin: 9px 0 24px;
    }
    #reminder-light-preview .summary {
      padding: 14px 16px; background: var(--rm-soft); border-radius: 10px;
      margin-bottom: 23px;
    }
    #reminder-light-preview .summary-kicker { color: #779097; font-size: 11px; margin-bottom: 5px; }
    #reminder-light-preview .summary-text { color: #27454e; font-size: 14px; line-height: 1.5; }
    #reminder-light-preview .action-row { display: flex; gap: 9px; }
    #reminder-light-preview .action-row .primary-action { flex: 1.4; }
    #reminder-light-preview .action-row .secondary-action,
    #reminder-light-preview .action-row .text-action { flex: 1; }
    #reminder-light-preview .alert-overlay {
      position: absolute; inset: 52px 0 0; z-index: 3; background: rgba(25, 45, 53, .31);
      display: flex; align-items: center; justify-content: center; padding: 18px;
    }
    #reminder-light-preview .alert-dialog {
      width: min(425px, 100%); background: #fff; border-radius: 16px;
      padding: 27px 27px 24px; box-shadow: 0 18px 45px rgba(15, 33, 39, .25);
    }
    #reminder-light-preview .alert-symbol {
      width: 40px; height: 40px; display: grid; place-items: center;
      background: #fff2e8; color: #d37631; border-radius: 12px; margin-bottom: 16px;
    }
    #reminder-light-preview .alert-symbol svg { width: 21px; height: 21px; }
    #reminder-light-preview .alert-dialog h2 { font-size: 22px; margin-bottom: 8px; }
    #reminder-light-preview .alert-dialog p {
      margin: 0 0 20px; color: #4d6570; font-size: 14px; line-height: 1.65;
      max-height: 145px; overflow: auto; white-space: pre-wrap;
    }
    #reminder-light-preview [hidden] { display: none !important; }
    @media (max-width: 480px) {
      #reminder-light-preview .preview-stage { padding: 10px 0; }
      #reminder-light-preview .window { border-radius: 12px; }
      #reminder-light-preview .window-body { padding: 23px 20px 22px; }
      #reminder-light-preview h2 { font-size: 21px; }
      #reminder-light-preview .time-row { gap: 6px; }
      #reminder-light-preview .time-separator { padding-bottom: 13px; font-size: 18px; }
      #reminder-light-preview .time-part input { height: 49px; font-size: 22px; }
      #reminder-light-preview .timer-digits { font-size: 43px; }
      #reminder-light-preview .action-row { flex-wrap: wrap; }
      #reminder-light-preview .action-row .primary-action { flex-basis: 100%; }
      #reminder-light-preview .alert-dialog { padding: 22px; }
    }
  </style>

  <div class="preview-switch" role="group" aria-label="预览界面状态">
    <button type="button" data-preview="setup" aria-pressed="true">设置提醒</button>
    <button type="button" data-preview="running" aria-pressed="false">计时中</button>
    <button type="button" data-preview="alert" aria-pressed="false">到点弹窗</button>
  </div>

  <div class="preview-stage viz-dotted-background">
    <div class="window" aria-label="提醒小程序浅色界面草图">
      <div class="window-bar">
        <span class="brand-mark"><i data-lucide="bell" aria-hidden="true"></i></span>
        <span class="brand-title">提醒小程序</span>
        <span class="window-actions" aria-hidden="true"><span>−</span><span>×</span></span>
      </div>

      <div class="window-body" data-view="setup" aria-live="polite">
        <h2>让重要的事准时出现</h2>
        <p class="intro">设置时长和内容，开始后安心做手头的事。</p>

        <label class="field-label" for="rm-hours">倒计时</label>
        <div class="time-row">
          <div class="time-part"><span>小时</span><input id="rm-hours" type="text" inputmode="numeric" value="00" aria-label="小时"></div>
          <span class="time-separator" aria-hidden="true">:</span>
          <div class="time-part"><span>分钟</span><input id="rm-minutes" type="text" inputmode="numeric" value="40" aria-label="分钟"></div>
          <span class="time-separator" aria-hidden="true">:</span>
          <div class="time-part"><span>秒</span><input id="rm-seconds" type="text" inputmode="numeric" value="00" aria-label="秒"></div>
        </div>

        <label class="field-label" for="rm-message">提醒内容（可选）</label>
        <textarea id="rm-message" placeholder="例如：整理今天的实验记录，准备下一步。"></textarea>
        <div class="sound-row">
          <label for="rm-sound"><i data-lucide="volume-2" aria-hidden="true"></i> 到点播放提示音</label>
          <input id="rm-sound" type="checkbox" checked aria-label="到点播放提示音">
        </div>
        <p class="validation" id="rm-validation" role="alert" hidden>请输入 1 秒到 24 小时的有效时长。</p>
        <button class="primary-action full" type="button" id="rm-start"><span class="button-icon"><i data-lucide="play" aria-hidden="true"></i></span>开始计时</button>
        <div class="footnote"><i data-lucide="panel-bottom" aria-hidden="true"></i>关闭窗口后，倒计时仍会在托盘继续</div>
      </div>

      <div class="window-body" data-view="running" aria-live="polite" hidden>
        <span class="status-pill"><span class="status-dot"></span><span id="rm-status">进行中</span></span>
        <h2 class="running-heading">专注当下，提醒会准时出现</h2>
        <div class="timer-area">
          <div class="timer-caption">剩余时间</div>
          <div class="timer-digits" id="rm-countdown">00:39:42</div>
        </div>
        <div class="progress-track" role="progressbar" aria-label="倒计时进度" aria-valuenow="26" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill"></div></div>
        <div class="progress-detail"><span>已开始</span><span>40 分钟提醒</span></div>
        <div class="summary"><div class="summary-kicker">到点提醒</div><div class="summary-text" id="rm-summary">整理今天的实验记录，准备下一步。</div></div>
        <div class="action-row">
          <button class="primary-action" type="button" id="rm-pause"><span class="button-icon"><i data-lucide="pause" aria-hidden="true"></i></span><span id="rm-pause-label">暂停</span></button>
          <button class="secondary-action" type="button" id="rm-reset">重置</button>
          <button class="text-action" type="button" id="rm-end">结束</button>
        </div>
        <div class="footnote"><i data-lucide="panel-bottom" aria-hidden="true"></i>关闭窗口后仍会继续计时</div>
      </div>

      <div class="alert-overlay" id="rm-alert" hidden>
        <div class="alert-dialog" role="dialog" aria-modal="true" aria-labelledby="rm-alert-title">
          <div class="alert-symbol"><i data-lucide="bell-ring" aria-hidden="true"></i></div>
          <h2 id="rm-alert-title">时间到了</h2>
          <p id="rm-alert-message">整理今天的实验记录，准备下一步。</p>
          <button class="primary-action full" type="button" id="rm-ack">知道了</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const root = document.getElementById('reminder-light-preview');
      const setup = root.querySelector('[data-view="setup"]');
      const running = root.querySelector('[data-view="running"]');
      const alert = root.querySelector('#rm-alert');
      const tabs = [...root.querySelectorAll('[data-preview]')];
      const hours = root.querySelector('#rm-hours');
      const minutes = root.querySelector('#rm-minutes');
      const seconds = root.querySelector('#rm-seconds');
      const message = root.querySelector('#rm-message');
      const validation = root.querySelector('#rm-validation');
      const countdown = root.querySelector('#rm-countdown');
      const summary = root.querySelector('#rm-summary');
      const alertMessage = root.querySelector('#rm-alert-message');
      const pauseLabel = root.querySelector('#rm-pause-label');
      const status = root.querySelector('#rm-status');
      let paused = false;

      function show(view) {
        setup.hidden = view !== 'setup';
        running.hidden = view === 'setup';
        alert.hidden = view !== 'alert';
        tabs.forEach(tab => tab.setAttribute('aria-pressed', String(tab.dataset.preview === view)));
        if (view === 'alert') countdown.textContent = '00:00:00';
        if (view === 'running' && countdown.textContent === '00:00:00') countdown.textContent = '00:39:42';
      }

      tabs.forEach(tab => tab.addEventListener('click', () => show(tab.dataset.preview)));
      root.querySelector('#rm-start').addEventListener('click', () => {
        const h = Number(hours.value || 0);
        const m = Number(minutes.value || 0);
        const s = Number(seconds.value || 0);
        const total = h * 3600 + m * 60 + s;
        if (![hours.value, minutes.value, seconds.value].every(v => /^\d*$/.test(v)) ||
            m > 59 || s > 59 || total < 1 || total > 86400) {
          validation.hidden = false;
          return;
        }
        validation.hidden = true;
        const hh = String(h).padStart(2, '0');
        const mm = String(m).padStart(2, '0');
        const ss = String(s).padStart(2, '0');
        countdown.textContent = `${hh}:${mm}:${ss}`;
        const text = message.value.trim() || '时间到了';
        summary.textContent = text;
        alertMessage.textContent = text;
        paused = false;
        pauseLabel.textContent = '暂停';
        status.textContent = '进行中';
        show('running');
      });
      root.querySelector('#rm-pause').addEventListener('click', () => {
        paused = !paused;
        pauseLabel.textContent = paused ? '继续' : '暂停';
        status.textContent = paused ? '已暂停' : '进行中';
      });
      root.querySelector('#rm-reset').addEventListener('click', () => show('setup'));
      root.querySelector('#rm-end').addEventListener('click', () => {
        hours.value = ''; minutes.value = ''; seconds.value = ''; message.value = '';
        validation.hidden = true;
        show('setup');
      });
      root.querySelector('#rm-ack').addEventListener('click', () => show('setup'));
      show('setup');
    })();
  </script>
</div>
